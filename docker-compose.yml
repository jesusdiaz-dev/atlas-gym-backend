version: '3.8'
services:
  postgres:
    image: postgres:14.3
    restart: always 
    ports:
      - "5432:5432"
    container_name: postgres-atlas-gym
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data